<div class="bg">
  <div class="card">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <h1>TaskAI</h1>
    </div>
    <p class="subtitle">Sign in to your workspace</p>

    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" [(ngModel)]="username" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="Enter your password" [(ngModel)]="password" />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="btn" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign In →' }}
    </button>

    <p class="footer">Don't have an account? <a routerLink="/signup">Sign up</a></p>
  </div>
</div>
